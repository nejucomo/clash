[workspace]
resolver = "3"
members = [
  "ast",
  "chumka",
  "clash",
  "interning",
  "test-case-dir",
  "test-case-dir-macros",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.metadata.crane]
name = "clash-workspace"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[workspace.dependencies]
clash-ast.path = "ast"
clash-chumka.path = "chumka"
clash-interning.path = "interning"
test-case-dir.path = "test-case-dir"
test-case-dir-macros.path = "test-case-dir-macros"

aliri_braid = "0.4.0"
chumsky = "0.13.0"
clap = "4.6.7"
derive_more = "2.1.1"
thiserror = "2.0.21"
yaffa = "0.1.1"
