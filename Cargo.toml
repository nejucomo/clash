[workspace]
resolver = "3"
members = [
  "ast",
  "clash",
  "test-case-dir",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.metadata.crane]
name = "clash-workspace"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[workspace.dependencies]
test-case-dir.path = "test-case-dir"

clap = "4.6.7"
derive_more = "2.1.1"
thiserror = "2.0.21"
yaffa = "0.1.1"
